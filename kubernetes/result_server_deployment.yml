apiVersion: apps/v1
kind: Deployment
metadata:
  name: result-server
  labels:
    app: result-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result-server
  template:
    metadata:
      labels:
        app: result-server
    spec:
      containers:
        - name: result-server
          image: yazenalbu/phonebook:result-v2
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /search
              port: 80
          envFrom:
            - configMapRef:
                name: database-config
            - configMapRef:
                name: servers-config
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
