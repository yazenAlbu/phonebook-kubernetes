apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: phonebook
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /search
            pathType: Prefix
            backend:
              service:
                name: result-server
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-server
                port:
                  number: 80
